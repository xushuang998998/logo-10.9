<body>
  <header class="topbar">
    <nav class="nav">
      <button class="home">⌂ <span>首页</span></button>
      <button class="active">会场搭建 <span>⌄</span></button>
    </nav>
  </header>
  <main class="grid">
    <aside class="components">
      <h2>组件目录</h2>
      <div class="component-list"><div class="component-row single"><i>▣</i><span>头图 Logo</span></div></div>
    </aside>
    <section class="stage">
      <div class="scene-tabs"><button class="active">● 会场 1 <span>×</span></button></div>
      <div class="preview-zoom" id="preview-zoom" aria-label="预览缩放比例">
        <button data-scale="0.65">65%</button>
        <button data-scale="0.85">85%</button>
        <button class="active" data-scale="1">100%</button>
        <button data-scale="1.2">120%</button>
      </div>
      <div class="logo-pill" id="logo-pill" data-mode="site">
        <img class="flash-logo" src="./meituan-flash-logo.png" alt="美团闪购">
        <span class="logo-divider" aria-hidden="true"></span>
        <img class="activity-logo" id="activity-logo" src="./promo-logos/踏青上美团.png" alt="活动 Logo">
        <span class="external-placeholder">待上传站外 Logo</span>
      </div>
    </section>
    <aside class="inspector">
      <section class="section">
        <div class="row blue"><span>Logo</span><button id="placement-label">站内⌄</button></div>
        <div class="switch-line"><span>显示</span><button class="switch on" id="switch" aria-label="切换 Logo 显示"><i></i></button></div>
        <div class="placement" id="logo-placement">
          <button data-place="flash">闪购</button>
          <button class="active" data-place="site">站内</button>
          <button data-place="external">站外</button>
        </div>
        <div class="logo-controls" id="logo-controls">
          <div class="source-tabs">
            <button id="upload-tab">⇧ 上传</button>
            <button class="active" id="library-tab">＋ 素材库</button>
            <input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
          </div>
          <div class="external-size" id="external-size" hidden>
            <span>Logo 大小</span>
            <div class="logo-stepper">
              <button id="logo-size-down" aria-label="缩小站外 Logo" title="缩小">−</button>
              <output id="logo-size-value">15px</output>
              <button id="logo-size-up" aria-label="放大站外 Logo" title="放大">＋</button>
            </div>
          </div>
          <div class="library-head"><span>素材库 Logo</span><b id="selected-name">T · 踏青上美团</b></div>
          <button class="library-summary" id="library-open"><img id="selected-thumb" src="./promo-logos/踏青上美团.png" alt="已选活动 Logo"><span>查看素材库 ›</span></button>
        </div>
      </section>
    </aside>
  </main>
  <div class="library-overlay" id="library-overlay" aria-hidden="true">
    <section class="library-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-titlebar"><div id="modal-title">▧ 素材中心 <small>· Logo</small></div><button class="modal-close" id="modal-close" aria-label="关闭素材库">×</button></header>
      <div class="modal-toolbar"><input class="modal-search" id="modal-search" type="search" placeholder="搜索素材名称或标签" aria-label="搜索素材"><button class="modal-upload" id="modal-upload">⇧ 上传素材</button></div>
      <div class="modal-results"><div class="modal-grid" id="modal-grid"></div><div class="modal-empty" id="modal-empty">没有找到匹配的 Logo</div></div>
      <footer class="modal-footer" id="modal-count">共 12 张素材</footer>
    </section>
  </div>
  <script src="./external-logos/manifest.js?v=20260929-2"></script>
  <script>
    const logos=["38节上美团","520礼遇季","618上美团","冰品节","春节大促","配送进校","七夕上美团","情人节上美团","双旦大促","踏青上美团"];
    const materialCollator=new Intl.Collator("zh-CN",{numeric:true});
    const builtInInitials={"38节上美团":"S","520礼遇季":"W","618上美团":"L","冰品节":"B","春节大促":"C","美团闪购":"M","美团闪购双11":"M","美团闪购周年庆":"M","配送进校":"P","七夕上美团":"Q","情人节上美团":"Q","双旦大促":"S","踏青上美团":"T","希宝":"X"};
    const pinyinBoundaries=[["A","阿"],["B","芭"],["C","擦"],["D","搭"],["E","蛾"],["F","发"],["G","噶"],["H","哈"],["J","击"],["K","喀"],["L","拉"],["M","妈"],["N","拿"],["O","哦"],["P","啪"],["Q","七"],["R","然"],["S","撒"],["T","塌"],["W","挖"],["X","昔"],["Y","压"],["Z","匝"]];
    function initialFor(name){
      const first=name.trim().charAt(0),latin=first.toUpperCase();
      if(builtInInitials[name])return builtInInitials[name];
      if(/[A-Z]/.test(latin))return latin;
      if(/[0-9]/.test(first))return {0:"L",1:"Y",2:"E",3:"S",4:"S",5:"W",6:"L",7:"Q",8:"B",9:"J"}[first];
      let initial="Z";
      for(const [letter,boundary] of pinyinBoundaries){if(materialCollator.compare(first,boundary)>=0)initial=letter}
      return initial;
    }
    const materials=[
      {id:"builtin:美团闪购",name:"美团闪购",scope:"flash",src:"./meituan-flash-logo.png"},
      {id:"builtin:美团闪购双11",name:"美团闪购双11",scope:"flash",src:"./promo-logos/美团闪购双11.png"},
      {id:"builtin:美团闪购周年庆",name:"美团闪购周年庆",scope:"flash",src:"./promo-logos/美团闪购周年庆.png"},
      ...logos.map(name=>({id:`builtin:${name}`,name,scope:"site",src:`./promo-logos/${name}.png`}))
    ];
    function sortMaterials(){materials.sort((a,b)=>initialFor(a.name).localeCompare(initialFor(b.name))||materialCollator.compare(a.name,b.name))}
    function materialLabel(item){return `${initialFor(item.name)} · ${item.name}`}
    sortMaterials();
    const pill=document.querySelector("#logo-pill"),flashLogo=document.querySelector(".flash-logo"),activity=document.querySelector("#activity-logo"),selected=document.querySelector("#selected-name"),overlay=document.querySelector("#library-overlay"),search=document.querySelector("#modal-search"),externalSize=document.querySelector("#external-size"),externalSizeValue=document.querySelector("#logo-size-value");
    const defaultMaterialId="builtin:踏青上美团",defaultFlashMaterialId="builtin:美团闪购";
    const selectedByMode={flash:defaultFlashMaterialId,site:defaultMaterialId,external:null};
    let currentMode="site";
    try{selectedByMode.flash=localStorage.getItem("selectedLogoMaterial:flash")||defaultFlashMaterialId;selectedByMode.site=localStorage.getItem("selectedLogoMaterial:site")||localStorage.getItem("selectedLogoMaterial")||defaultMaterialId;selectedByMode.external=localStorage.getItem("selectedLogoMaterial:external")}catch{}
    function upsertMaterial(item){
      const index=materials.findIndex(entry=>entry.scope===item.scope&&materialCollator.compare(entry.name,item.name)===0);
      if(index<0){materials.push(item);return item}
      const existing=materials[index];
      if(existing.uploaded&&!item.uploaded){if(selectedByMode[item.scope]===item.id)selectedByMode[item.scope]=existing.id;return existing}
      materials.splice(index,1,item);
      if(selectedByMode[item.scope]===existing.id)selectedByMode[item.scope]=item.id;
      return item;
    }
    function externalLogoHeight(){
      const id=selectedByMode.external;
      if(!id)return 15;
      let value=15;
      try{value=Number(localStorage.getItem(`externalLogoHeight:${id}`))||15}catch{}
      return Math.min(18,Math.max(10,value));
    }
    function updateExternalSizeControls(){
      externalSize.hidden=currentMode!=="external";
      externalSizeValue.textContent=`${externalLogoHeight()}px`;
    }
    function fitVisibleLogo(image,targetHeight,targetWidth){
      if(!image.naturalWidth||!image.naturalHeight)return;
      const canvas=document.createElement("canvas"),scale=Math.min(1,640/Math.max(image.naturalWidth,image.naturalHeight));canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext("2d");context.drawImage(image,0,0,canvas.width,canvas.height);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
      let transparentPixels=0;
      for(let index=3;index<pixels.length;index+=4){if(pixels[index]<245)transparentPixels++}
      const transparent=transparentPixels>canvas.width*canvas.height*.01;
      const corners=[[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]];
      const background=[0,1,2].map(channel=>corners.reduce((sum,[x,y])=>sum+pixels[(y*canvas.width+x)*4+channel],0)/4);
      let left=canvas.width,right=-1,top=canvas.height,bottom=-1;
      for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){
        const index=(y*canvas.width+x)*4,alpha=pixels[index+3];
        const distance=Math.abs(pixels[index]-background[0])+Math.abs(pixels[index+1]-background[1])+Math.abs(pixels[index+2]-background[2]);
        if(transparent?alpha>48:distance>42){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}
      }
      if(right<left||bottom<top){left=0;right=canvas.width-1;top=0;bottom=canvas.height-1}
      left=Math.max(0,left-1);right=Math.min(canvas.width-1,right+1);top=Math.max(0,top-1);bottom=Math.min(canvas.height-1,bottom+1);
      const visibleWidth=right-left+1,visibleHeight=bottom-top+1;
      const displayScale=Math.min(targetWidth/visibleWidth,targetHeight/visibleHeight);
      image.style.width=`${canvas.width*displayScale}px`;
      image.style.height=`${canvas.height*displayScale}px`;
      image.style.clipPath=`inset(${top*displayScale}px ${(canvas.width-right-1)*displayScale}px ${(canvas.height-bottom-1)*displayScale}px ${left*displayScale}px)`;
      image.style.margin=`-${top*displayScale}px -${(canvas.width-right-1)*displayScale}px -${(canvas.height-bottom-1)*displayScale}px -${left*displayScale}px`;
    }
    function sizeActivityLogo(){
      if(activity.currentSrc!==activity.dataset.expectedSource)return;
      fitVisibleLogo(activity,currentMode==="external"?externalLogoHeight():15.4,currentMode==="external"?180:160);
    }
    activity.addEventListener("load",sizeActivityLogo);
    if(activity.complete)sizeActivityLogo();
    function showCurrentMaterial(){
      const fallbackId=currentMode==="flash"?defaultFlashMaterialId:currentMode==="site"?defaultMaterialId:null;
      const item=materials.find(entry=>entry.scope===currentMode&&entry.id===selectedByMode[currentMode])||(fallbackId?materials.find(entry=>entry.id===fallbackId):null);
      pill.classList.toggle("awaiting-external",currentMode==="external"&&!item);
      const thumb=document.querySelector("#selected-thumb");
      if(item){
        flashLogo.src=currentMode==="flash"?item.src:"./meituan-flash-logo.png";
        activity.dataset.materialSource=item.src;activity.dataset.expectedSource=new URL(item.src,location.href).href;
        if(currentMode!=="flash")activity.src=item.src;
        selected.textContent=materialLabel(item);thumb.src=item.src;thumb.hidden=false;
      }
      else if(currentMode==="external"){selected.textContent="待上传站外 Logo";thumb.hidden=true}
      document.querySelector("#library-tab").classList.toggle("active",!!item);
      document.querySelector("#upload-tab").classList.toggle("active",!item);
      updateExternalSizeControls();
      if(item&&currentMode==="external"&&activity.complete)requestAnimationFrame(sizeActivityLogo);
    }
    function selectMaterial(item){
      if(item.scope!==currentMode)return;
      selectedByMode[currentMode]=item.id;
      showCurrentMaterial();
      try{localStorage.setItem(`selectedLogoMaterial:${currentMode}`,item.id)}catch{}
    }
    showCurrentMaterial();
    function openMaterialDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open("logo-material-library",1);request.onupgradeneeded=()=>request.result.createObjectStore("logos",{keyPath:"id"});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    async function saveUploadedMaterial(item,file){const db=await openMaterialDb();return new Promise((resolve,reject)=>{const transaction=db.transaction("logos","readwrite"),store=transaction.objectStore("logos"),request=store.getAll();request.onsuccess=()=>{for(const saved of request.result)if(saved.scope===item.scope&&materialCollator.compare(saved.name,item.name)===0&&saved.id!==item.id)store.delete(saved.id);store.put({id:item.id,name:item.name,scope:item.scope,file})};transaction.oncomplete=()=>{db.close();resolve()};transaction.onerror=()=>{db.close();reject(transaction.error)}})}
    function validateExternalUpload(file){
      return new Promise(resolve=>{
        const url=URL.createObjectURL(file),image=new Image();
        image.onload=()=>{
          const ratio=image.naturalWidth/image.naturalHeight;
          const allowedShape=ratio>=1.8||(ratio>=.8&&ratio<=1.35);
          const clearEnough=image.naturalWidth>=160&&image.naturalHeight>=80;
          URL.revokeObjectURL(url);
          resolve(allowedShape&&clearEnough);
        };
        image.onerror=()=>{URL.revokeObjectURL(url);resolve(false)};
        image.src=url;
      });
    }
    async function loadUploadedMaterials(){const db=await openMaterialDb();const saved=await new Promise((resolve,reject)=>{const request=db.transaction("logos","readonly").objectStore("logos").getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();for(const item of saved){if(item.scope==="external"&&!(await validateExternalUpload(item.file)))continue;upsertMaterial({id:item.id,name:item.name,scope:item.scope||"site",src:URL.createObjectURL(item.file),uploaded:true})}sortMaterials();showCurrentMaterial();if(overlay.classList.contains("open"))renderMaterials()}
    async function loadExternalMaterials(){
      let files=window.EXTERNAL_LOGOS;
      if(!Array.isArray(files)){
        const response=await fetch("./external-logos/manifest.json?v=20260929-2");
        if(!response.ok)throw new Error("站外素材清单加载失败");
        files=await response.json();
      }
      for(const file of files)upsertMaterial({id:`external:${file.file}`,name:file.name,scope:"external",src:file.src||`./external-logos/${encodeURIComponent(file.file)}?v=20260929-2`});
      sortMaterials();
      if(!materials.some(item=>item.scope==="external"&&item.id===selectedByMode.external)){
        selectedByMode.external=materials.find(item=>item.scope==="external")?.id||null;
        if(selectedByMode.external)try{localStorage.setItem("selectedLogoMaterial:external",selectedByMode.external)}catch{}
      }
      if(currentMode==="external")showCurrentMaterial();
      if(overlay.classList.contains("open"))renderMaterials();
    }
    loadUploadedMaterials().catch(()=>{}).finally(()=>loadExternalMaterials().catch(()=>{}));
    function renderMaterials(){
      const query=search.value.trim().toLowerCase(),matches=materials.filter(item=>item.scope===currentMode&&(item.name.toLowerCase().includes(query)||materialLabel(item).toLowerCase().startsWith(query))),grid=document.querySelector("#modal-grid");
      grid.replaceChildren();
      matches.forEach(item=>{const card=document.createElement("button"),visual=document.createElement("span"),image=document.createElement("img"),label=document.createElement("span");card.className=`material-card ${item.id===selectedByMode[currentMode]?"selected":""}`;card.dataset.id=item.id;card.setAttribute("aria-label",`选择${materialLabel(item)}`);visual.className="material-image";image.addEventListener("load",()=>fitVisibleLogo(image,70,160));image.src=item.src;image.alt="";label.className="material-name";label.textContent=materialLabel(item);visual.append(image);card.append(visual,label);grid.append(card)});
      document.querySelector("#modal-empty").style.display=matches.length?"none":"block";
      document.querySelector("#modal-empty").textContent=!query&&currentMode==="external"?"暂无站外 Logo，可上传素材":"没有找到匹配的 Logo";
      document.querySelector("#modal-count").textContent=`共 ${matches.length} 张素材`;
    }
    function closeLibrary(){overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true");document.querySelector("#library-open").focus()}
    function openLibrary(){search.value="";renderMaterials();overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");search.focus()}
    document.querySelector("#switch").addEventListener("click",e=>{e.currentTarget.classList.toggle("on");pill.style.display=e.currentTarget.classList.contains("on")?"inline-flex":"none"});
    document.querySelector("#preview-zoom").addEventListener("click",event=>{
      const button=event.target.closest("button[data-scale]");
      if(!button)return;
      pill.style.setProperty("--preview-scale",button.dataset.scale);
      document.querySelectorAll("#preview-zoom button").forEach(item=>item.classList.toggle("active",item===button));
    });
    document.querySelectorAll(".placement button[data-place]").forEach(btn=>btn.addEventListener("click",()=>{
      const mode=btn.dataset.place;
      currentMode=mode;
      document.querySelectorAll(".placement button").forEach(x=>x.classList.toggle("active",x===btn));
      pill.dataset.mode=mode;
      document.querySelector("#logo-controls").hidden=false;
      document.querySelector("#placement-label").textContent=({flash:"闪购⌄",site:"站内⌄",external:"站外⌄"})[mode];
      showCurrentMaterial();
    }));
    function changeExternalLogoSize(delta){
      if(currentMode!=="external"||!selectedByMode.external)return;
      const value=Math.min(18,Math.max(10,externalLogoHeight()+delta));
      try{localStorage.setItem(`externalLogoHeight:${selectedByMode.external}`,String(value))}catch{}
      updateExternalSizeControls();
      sizeActivityLogo();
    }
    document.querySelector("#logo-size-down").addEventListener("click",()=>changeExternalLogoSize(-1));
    document.querySelector("#logo-size-up").addEventListener("click",()=>changeExternalLogoSize(1));
    document.querySelector("#library-tab").addEventListener("click",openLibrary);
    document.querySelector("#library-open").addEventListener("click",openLibrary);
    document.querySelector("#modal-close").addEventListener("click",closeLibrary);
    overlay.addEventListener("click",e=>{if(e.target===overlay)closeLibrary()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeLibrary()});
    search.addEventListener("input",renderMaterials);
    document.querySelector("#modal-grid").addEventListener("click",e=>{const btn=e.target.closest("button[data-id]");if(!btn)return;const item=materials.find(x=>x.id===btn.dataset.id);if(!item)return;selectMaterial(item);closeLibrary()});
    document.querySelector("#upload-tab").addEventListener("click",()=>document.querySelector("#upload").click());
    document.querySelector("#modal-upload").addEventListener("click",()=>document.querySelector("#upload").click());
    document.querySelector("#upload").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;if(currentMode==="external"&&!(await validateExternalUpload(file))){e.target.value="";alert("站外仅支持清晰的横版 Logo+品牌名，或方形图形 Logo。横版宽高比需至少 1.8:1，方形需接近 1:1，图片尺寸不低于 160×80px。");return}const name=file.name.replace(/\.[^.]+$/,"").trim()||"未命名Logo",item={id:`upload:${currentMode}:${name.toLocaleLowerCase("zh-CN")}`,name,scope:currentMode,src:URL.createObjectURL(file),uploaded:true};upsertMaterial(item);sortMaterials();selectMaterial(item);e.target.value="";closeLibrary();try{await saveUploadedMaterial(item,file)}catch{alert("Logo 已加入当前页面，但未能保存到本地素材库。")}});
  </script>
</body>
</html>
